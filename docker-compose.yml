version: "3.9"

services:
  db:
    image: postgres:15
    container_name: everything_db
    env_file: .env
    ports:
      - "55432:5432"            # host port 55432 to avoid host conflicts
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -h localhost || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - everything_net

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: everything_api
    env_file: .env
    ports:
      - "8001:8000"           # host 8001 -> container 8000
    volumes:
      - ./src:/app/src
      - ./models:/app/models
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - everything_net

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: everything_dashboard
    env_file: .env
    ports:
      - "8502:8501"
    volumes:
      - ./src:/app/src
      - ./models:/app/models
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - everything_net
    environment:
      - API_URL=http://everything_api:8000 
      
volumes:
  pg_data:

networks:
  everything_net:
    driver: bridge
